variables:
    SMOKE_PRODUCT_NAME: BlockchainBaccarat
    DOCKER_SLIM: enable
    ENABLE_NODEJS_INTEGRATION_TEST: 'true'
    NODEJS_INTEGRATION_TEST_IMAGE_VERSION: registry.nexdev.net:5050/docker/node:18.1-buster-slim
    NODEJS_INTEGRATION_TEST_DB_IMAGE_VERSION: registry.nexdev.net:5050/docker/database/mongo:4.4.8
  
include:
    - project: "ci/repos-ci/pentagon_l1_blockchain_baccarat_service"
      ref: master
      file: "gitlab-ci.yml"
    - project: "ci/common-ci"
      ref: docker-slim
      file: "docker/base/build-docker-image.gitlab-ci.yml"
    - project: "ci/common-ci"
      ref: rocketor
      file: "integration-test/nodejs-integration-test.gitlab-ci.yml"

.if-deploy-local: &if-deploy-local
    if: "$CI_COMMIT_TAG =~ /local/"

.if-deploy-sit: &if-deploy-sit
    if: "$CI_COMMIT_TAG =~ /sit/"

.if-deploy-uat: &if-deploy-uat
    if: "$CI_COMMIT_TAG =~ /uat/"

.if-deploy-prod: &if-deploy-prod
    if: "$CI_COMMIT_TAG =~ /prod/"

unit-test-js:
  stage: test
  image: registry.nexdev.net:5050/docker/node:18.1-buster-slim
  tags:
    - docker
  before_script:
    - npm set registry http://npm.lumigame.com
    - yarn install
    - npm run test
  script:
    - npm run test-coverage
  rules:
    - <<: *if-deploy-local
      when: never
    - <<: *if-deploy-sit
      when: never
    - <<: *if-deploy-uat
      when: never
    - <<: *if-deploy-prod
      when: never
    - when: always
  allow_failure: true
  artifacts:
    when: always
    paths:
      - ./coverage
      - ./reports
    expire_in: 1 day
    reports:
        junit: coverage/*.xml
        cobertura: coverage/cobertura-coverage.xml